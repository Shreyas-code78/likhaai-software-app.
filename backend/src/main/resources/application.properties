spring.application.name=likhaai-backend
server.port=8080

spring.data.mongodb.uri=mongodb://localhost:27017/likhaai
spring.data.mongodb.database=likhaai

jwt.secret=likhaai_super_secret_key_2024_minimum_32_chars_long
jwt.expiration=86400000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

cors.allowed-origins=http://localhost:3000,http://localhost:3001

logging.level.com.likhaai=DEBUG
